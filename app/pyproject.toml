[project]
name = "senal"
version = "0.1.0"
description = "Señal TVN: copiloto de inteligencia informativa con evidencia trazable. Parte 2 hackIAthon."
authors = [{ name = "BryR0" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "python-dotenv>=1.0",
    "defusedxml>=0.7.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-defusedxml>=0.7.0.20260504",
    "pypdf>=5",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: llama a internet; se excluye por defecto"]
addopts = "-m 'not network' --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.isort]
known-first-party = ["senal"]
